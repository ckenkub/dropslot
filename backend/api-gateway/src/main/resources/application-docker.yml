spring:
  config:
    import: optional:classpath:common-docker.yml
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**,/api/auth/**
          filters:
            - StripPrefix=1
        - id: store-service
          uri: http://store-service:8082
          predicates:
            - Path=/api/stores/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client: DEBUG

# Enable Eureka discovery when running in Docker
# Eureka removed for docker profile: use direct hostnames or compose network when needed
